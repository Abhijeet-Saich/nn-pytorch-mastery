<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Semester Party</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050505;
            color: #d0d0d0;
            font-family: 'Anton', sans-serif;
            overflow: hidden;
        }

        /* Dark, Grungy Background */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 60% 40%, #1a0005 0%, #080002 50%, #000000 100%);
            z-index: 1;
        }

        .noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.12;
            mix-blend-mode: overlay;
            z-index: 2;
            pointer-events: none;
        }

        /* Grid overlay for texture */
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 4px 4px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.5) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 0, 0, 0.5) 1px, transparent 1px);
            z-index: 3;
            pointer-events: none;
        }

        .art-container {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 4;
        }

        /* Flag Styling */
        .flag-content {
            width: 100%;
            height: 100%;
            background: linear-gradient(110deg, #5c0011 0%, #8f001a 40%, #4a000d 60%, #750015 100%);
            clip-path: polygon(0 3%, 100% 0%, 94% 50%, 100% 100%, 0 97%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: inset 15px 0 30px rgba(0,0,0,0.9);
            border-left: 8px solid #000;
            transform: skewY(-2deg);
            text-align: center;
        }

        .flag-sub {
            font-family: 'Permanent Marker', cursive;
            color: #00f5d4; /* Electric Cyan Accent */
            font-size: 3vw;
            transform: rotate(-4deg);
            margin: 0 0 -2vw 0;
            text-shadow: 2px 2px 10px rgba(0, 245, 212, 0.4);
            letter-spacing: 2px;
        }

        .flag-title {
            font-size: 9vw;
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            color: #e0e0e0; /* Silver instead of bright white */
            text-shadow: 8px 8px 0px rgba(0, 0, 0, 0.8);
        }

        /* Custom Glitch using Cyan and Crimson */
        .glitch {
            position: relative;
        }
        .glitch::before, .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        .glitch::before {
            left: 4px;
            text-shadow: -3px 0 #00f5d4; /* Cyan */
            clip: rect(24px, 1550px, 90px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -4px;
            text-shadow: 3px 0 #050505; /* Black shadow */
            clip: rect(85px, 1550px, 140px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 31px, 0); }
            20% { clip: rect(65px, 9999px, 16px, 0); }
            40% { clip: rect(43px, 9999px, 5px, 0); }
            60% { clip: rect(78px, 9999px, 93px, 0); }
            80% { clip: rect(12px, 9999px, 54px, 0); }
            100% { clip: rect(89px, 9999px, 23px, 0); }
        }

        .flag-details {
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00f5d4;
            padding: 15px 30px;
            color: #8d99ae;
            font-size: 2vw;
            letter-spacing: 5px;
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.15);
            text-transform: uppercase;
        }

        .flag-details span {
            color: #00f5d4;
        }

        .flag-warning {
            margin-top: 15px;
            font-family: 'Permanent Marker', cursive;
            color: #8f001a;
            font-size: 1.5vw;
        }

        /* Pulsing Glow for Censor text */
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(0, 245, 212, 0.6)); }
            50% { filter: drop-shadow(0 0 15px rgba(0, 245, 212, 1)); }
        }
        .censor-text {
            animation: pulseGlow 2s infinite;
        }

    </style>
</head>
<body>
    <div class="background"></div>
    <div class="noise"></div>
    <div class="grid"></div>
    
    <div class="art-container">
        <!-- SVG Canvas scaling to fill the screen while maintaining aspect roughly -->
        <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMax meet" style="width: 100%; height: 100%; position: absolute; bottom: 0; left: 0;">
            <defs>
                <filter id="neonCyan">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <filter id="darkShadow">
                    <feDropShadow dx="10" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.9"/>
                </filter>
            </defs>
            
            <!-- Background textures / lighting -->
            <rect x="0" y="0" width="1000" height="800" fill="url(#darkShadow)" opacity="0"/>
            
            <!-- Flag Pole (Removed since he is holding it in front of him with both hands) -->

            <!-- The Flag containing the HTML Message -->
            <!-- Silhouette Person -->
            <g filter="url(#darkShadow)">
                <!-- Body / Hoodie (positioned higher and centered) -->
                <path d="M 150,850 C 250,550 350,500 450,550 C 550,500 650,550 750,850 Z" fill="#050505" stroke="#111" stroke-width="2"/>
                
                <!-- Left Arm reaching up to hold flag -->
                <path d="M 320,620 Q 250,450 300,320" fill="none" stroke="#050505" stroke-width="55" stroke-linecap="round"/>
                
                <!-- Right Arm reaching up to hold flag -->
                <path d="M 580,620 Q 650,450 600,320" fill="none" stroke="#050505" stroke-width="55" stroke-linecap="round"/>
                
                <!-- Left Hand grabbing flag -->
                <circle cx="295" cy="320" r="35" fill="#050505"/>
                <rect x="275" y="295" width="40" height="12" fill="#111" rx="4" transform="rotate(20 295 320)"/>
                
                <!-- Right Hand grabbing flag -->
                <circle cx="605" cy="320" r="35" fill="#050505"/>
                <rect x="585" y="295" width="40" height="12" fill="#111" rx="4" transform="rotate(-20 605 320)"/>
                
                <!-- Head (centered and higher) -->
                <circle cx="450" cy="400" r="85" fill="#050505" stroke="#111" stroke-width="2"/>
                
                <!-- Censor Bar -->
                <rect x="330" y="370" width="240" height="50" fill="#000" transform="rotate(-3 450 400)"/>
                <rect x="330" y="370" width="240" height="50" fill="none" stroke="#00f5d4" stroke-width="2" filter="url(#neonCyan)" transform="rotate(-3 450 400)"/>
                
                <!-- Censored Text -->
                <text x="450" y="405" fill="#00f5d4" font-size="32" font-family="'Anton', sans-serif" letter-spacing="5" text-anchor="middle" class="censor-text" transform="rotate(-3 450 400)">CENSORED</text>
            </g>

            <!-- Flag draped across the front, held by both hands -->
            <foreignObject x="150" y="320" width="600" height="350">
                <div xmlns="http://www.w3.org/1999/xhtml" class="flag-content" style="box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 2px solid #3a000d; border-top: 5px solid #111;">
                    <h2 class="flag-sub">THE FINAL CHAPTER</h2>
                    <h1 class="flag-title glitch" data-text="PROJECT ENDGAME">PROJECT ENDGAME</h1>
                    <div class="flag-details">
                        <span>FRIDAY 10PM</span> • NO RULES
                    </div>
                    <div class="flag-warning">PREPARE FOR CHAOS</div>
                </div>
            </foreignObject>
        </svg>
    </div>
</body>
</html>
